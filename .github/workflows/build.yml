name: Build LingoKin APK & AAB
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
      - run: npm install
      - name: Prepare web folder
        run: |
          mkdir -p www
          cp index.html www/
          cp manifest.json www/ || echo "no manifest"
          cp sw.js www/ || echo "no sw"
          cp *.png www/ || echo "no png"
      - name: Build Android
        run: |
          npx cap add android
          npx cap copy android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          ./gradlew bundleDebug
      - uses: actions/upload-artifact@v5
        with:
          name: LingoKin-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v5
        with:
          name: LingoKin-AAB
          path: android/app/build/outputs/bundle/debug/app-debug.aab
