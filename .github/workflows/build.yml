name: Build LingoKin Palm Store
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install
        run: npm install

      - name: Prepare www
        run: |
          mkdir -p www
          cp index.html www/
          cp privacy.html www/ || true
          cp manifest.json www/ || true
          ls www/

      - name: Add Android
        run: |
          npx cap add android || true
          npx cap copy android
          npx cap sync android

      - name: Create Keystore
        run: |
          mkdir -p android/app
          rm -f android/app/release.keystore
          keytool -genkeypair -v -keystore android/app/release.keystore -alias lingokin -keyalg RSA -keysize 2048 -validity 10000 -storepass lingokin123 -keypass lingokin123 -dname "CN=Joseph, OU=LingoKin, L=Lubumbashi, C=CD"

      - name: Build AAB Release
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon -Pandroid.injected.signing.store.file=app/release.keystore -Pandroid.injected.signing.store.password=lingokin123 -Pandroid.injected.signing.key.alias=lingokin -Pandroid.injected.signing.key.password=lingokin123

      - uses: actions/upload-artifact@v4
        with:
          name: LingoKin-AAB-Release
          path: android/app/build/outputs/bundle/release/*.aab
